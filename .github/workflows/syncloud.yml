name: "Syncloud"

on:
  workflow_dispatch:
  push:
    tags: ["v*-syncloud.*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            build_env: ""
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            build_env: "JEMALLOC_SYS_WITH_LG_PAGE=16 "
          - target: armv7-unknown-linux-musleabihf
            runner: ubuntu-latest
            build_env: "JEMALLOC_SYS_WITH_LG_PAGE=16 "
    name: Build / ${{matrix.target}}
    runs-on: ${{matrix.runner}}
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/.ghcup /usr/local/share/powershell /usr/share/swift /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /mnt /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["https://mirror.gcr.io"]
          driver-opts: |
            network=host

      - name: Log In to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{github.repository_owner}}
          password: ${{github.token}}

      - name: Build
        uses: docker/bake-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
          GITHUB_TOKEN: ${{github.token}}
          TARGET: ${{matrix.target}}
          GHCR_REPO: ghcr.io/${{github.repository}}
          BUILD_ENV: ${{matrix.build_env}}
        with:
          source: .
          files: docker-bake.hcl
          targets: build

      - name: Package
        run: |
          sudo chown -R "$(id -u)" artifact
          tar -czf stalwart-${{matrix.target}}.tar.gz -C artifact stalwart
          sha256sum stalwart-${{matrix.target}}.tar.gz > stalwart-${{matrix.target}}.tar.gz.sha256

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: stalwart-${{matrix.target}}
          path: stalwart-${{matrix.target}}.tar.gz*

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{github.token}}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --notes "Stalwart ${GITHUB_REF_NAME%%-syncloud.*} with Syncloud patches"
